name: Captures d'écran

# Lancé à la demande : démarre un émulateur Android, installe l'APK de debug,
# parcourt les écrans et commite les captures dans docs/screenshots/.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "APK à tester : debug ou release"
        default: debug
        type: choice
        options: [debug, release]
      script_mode:
        description: "Mode du script : vide (parcours complet) ou smoke (diagnostic rapide)"
        default: ""
        type: string
      upgrade_from:
        description: "Tag d'une Release à installer d'abord pour tester la mise à jour (ex. v1.1.2), vide sinon"
        default: ""
        type: string

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: APK
        run: ./gradlew --no-daemon assemble${{ inputs.variant == 'release' && 'Release' || 'Debug' }}
      - name: Ancienne version recompilée depuis son tag (test de mise à jour)
        if: ${{ inputs.upgrade_from != '' }}
        run: |
          # Même clé que la nouvelle version, sinon Android refuse la mise à jour.
          mkdir -p ~/.android && cp app/debug.keystore ~/.android/debug.keystore
          git fetch --depth=1 origin "refs/tags/${{ inputs.upgrade_from }}:refs/tags/${{ inputs.upgrade_from }}"
          git worktree add old-src "${{ inputs.upgrade_from }}"
          cp app/debug.keystore old-src/app/debug.keystore
          # Force l'ancienne version à signer avec la même clé que la nouvelle.
          printf '\nandroid { signingConfigs { getByName("debug") { storeFile = file("debug.keystore"); storePassword = "android"; keyAlias = "androiddebugkey"; keyPassword = "android" } } }\n' >> old-src/app/build.gradle.kts
          (cd old-src && ./gradlew --no-daemon assembleRelease)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs old-src/app/build/outputs/apk/release/app-release.apk | grep SHA-256
          mkdir -p old-apk && cp old-src/app/build/outputs/apk/release/app-release.apk old-apk/
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Émulateur et captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            rm -f docs/screenshots/*.png
            if [ -d old-apk ]; then adb install old-apk/*.apk && bash scripts/screenshots.sh seed; fi
            adb install -r app/build/outputs/apk/${{ inputs.variant || 'debug' }}/app-${{ inputs.variant || 'debug' }}.apk
            if [ -d old-apk ]; then bash scripts/screenshots.sh verify-upgrade && adb shell pm clear com.livemachine.academy; fi
            bash scripts/screenshots.sh ${{ inputs.script_mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots/
      - name: Publier les captures sur la branche
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Captures d'écran de l'émulateur [skip ci]" || exit 0
          git push
