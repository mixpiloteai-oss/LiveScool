name: Publier l'APK

# Lancé à la demande : construit les APK debug et release, les vérifie
# (aapt, apksigner, absence de permission réseau) et les publie dans une
# Release GitHub, téléchargeable directement depuis le téléphone.
# Produit aussi l'AAB (Android App Bundle) pour Google Play, en artefact du workflow :
# publiable seulement s'il est signé avec la clé d'envoi secrète (secrets LMA_*).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Clé de signature release (optionnelle)
        env:
          KEYSTORE_B64: ${{ secrets.LMA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LMA_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Clé release fournie."
          else
            echo "Pas de clé release : la release sera signée avec la clé debug."
          fi
      - name: Tests, APK et AAB
        # Adresse publique du backend de l'assistant (variable de dépôt, pas un secret).
        env:
          LMA_KEYSTORE_PASSWORD: ${{ secrets.LMA_KEYSTORE_PASSWORD }}
          LMA_KEY_ALIAS: ${{ secrets.LMA_KEY_ALIAS }}
          LMA_KEY_PASSWORD: ${{ secrets.LMA_KEY_PASSWORD }}
          LMA_ASSISTANT_URL: ${{ vars.LMA_ASSISTANT_URL }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease bundleRelease
      - name: Vérifier les APK
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/LiveMachineAcademy-$VERSION-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/LiveMachineAcademy-$VERSION-release.apk"
          for apk in dist/*.apk; do
            echo "=== $apk ($(stat -c %s "$apk") octets)"
            "$BT/aapt" dump badging "$apk" | grep -E "^package|sdkVersion|targetSdkVersion|launchable-activity"
            PERMS=$("$BT/aapt" dump permissions "$apk")
            echo "$PERMS"
            # Permissions autorisées : INTERNET (assistant, analyse) et RECORD_AUDIO (extrait au micro). Toute autre fait échouer.
            OTHER=$(echo "$PERMS" | grep "uses-permission" | grep -v -e "android.permission.INTERNET" -e "android.permission.RECORD_AUDIO" -e "DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" || true)
            if [ -n "$OTHER" ]; then echo "ERREUR : permission non prévue : $OTHER"; exit 1; fi
            "$BT/apksigner" verify --print-certs "$apk" | head -3
          done
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
      - name: Vérifier l'AAB Google Play
        run: |
          set -e
          mkdir -p play
          AAB="play/LiveMachineAcademy-$VERSION.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$AAB"
          echo "=== $AAB ($(stat -c %s "$AAB") octets)"
          CERT=$(keytool -printcert -jarfile "$AAB")
          echo "$CERT" | head -4
          # Empreinte SHA-256 de app/debug.keystore (clé partagée, non secrète)
          if echo "$CERT" | grep -q "7C:11:9A:55:3D:B8:77:5D:91:F1:E6:0B:A2:78:FF:B3:9C:DC:39:B7:D6:34:ED:1A:69:EF:46:1E:36:71:78:C2"; then
            echo "::warning::AAB signé avec la clé debug partagée : refusé par Google Play. Ajouter les secrets LMA_KEYSTORE_* (clé d'envoi)."
          else
            echo "AAB signé avec la clé d'envoi : prêt pour Google Play."
          fi
          sha256sum "$AAB" | tee play/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: live-machine-academy-aab-google-play
          path: play/
      - uses: actions/upload-artifact@v4
        with:
          name: live-machine-academy-apk
          path: dist/
      - name: Publier la Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Live Machine Academy $VERSION" \
            --notes "APK Android à installer sur le téléphone. Prendre le fichier -debug.apk (ou -release.apk, optimisé). Voir README pour l'installation."
